name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  assemble-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Clean and Assemble debug (no NDK)
        id: assemble
        run: |
          ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee assemble.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
        continue-on-error: true

      - name: List and collect outputs
        if: always()
        run: |
          echo "=== last 100 lines of assemble.log ==="
          tail -100 assemble.log || true
          echo "=== find APKs ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "no apks found"
          echo "=== outputs tree ==="
          find app/build/outputs -type f 2>/dev/null | head -50 || echo "no outputs"
          mkdir -p build-artifacts
          cp assemble.log build-artifacts/ 2>/dev/null || true
          # copy any apk anywhere under app/build
          find app/build -name "*.apk" -type f -exec cp -v {} build-artifacts/ \; 2>/dev/null || true
          # also try standard path
          if [ -d app/build/outputs/apk ]; then
            cp -rv app/build/outputs/apk build-artifacts/ 2>/dev/null || true
          fi
          ls -laR build-artifacts/ || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-and-logs
          path: build-artifacts/
          if-no-files-found: warn

      - name: Fail if assemble failed
        if: env.GRADLE_EXIT != '0'
        run: exit 1

  assemble-ndk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug with NDK
        run: ./gradlew :app:assembleDebug -Paura.enableNdk=true --no-daemon --stacktrace 2>&1 | tee assemble-ndk.log
        continue-on-error: true

      - name: Upload NDK log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-assemble-log
          path: assemble-ndk.log
          if-no-files-found: warn
