name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  assemble-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug (no NDK)
        id: assemble
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Dump error log on failure
        if: steps.assemble.outcome == 'failure'
        run: |
          echo "===== GRADLE ERROR DUMP ====="
          echo "----- kotlin compile logs -----"
          find app/build -path '*compileDebugKotlin*' -name '*.log' 2>/dev/null | while read f; do echo "### $f"; tail -100 "$f"; done || true
          echo "----- ksp logs -----"
          find app/build -path '*ksp*' -type f -name '*.log' 2>/dev/null | head -5 | while read f; do echo "### $f"; tail -50 "$f"; done || true
          echo "----- grep for e: errors in build -----"
          find app/build -name '*.txt' -o -name '*.log' 2>/dev/null | head -30 | xargs grep -h "^e: " 2>/dev/null | head -40 || true
          echo "----- listing app/build -----"
          ls -la app/build/ 2>/dev/null || true
          ls -la app/build/tmp/kotlin-classes/ 2>/dev/null || true
          exit 1

      - name: Unit tests
        if: steps.assemble.outcome == 'success'
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  assemble-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug with NDK
        run: ./gradlew :app:assembleDebug -Paura.enableNdk=true --no-daemon --stacktrace
