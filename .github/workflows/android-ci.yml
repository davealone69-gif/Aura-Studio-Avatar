name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  assemble-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug (no NDK)
        id: assemble
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log
        continue-on-error: true

      - name: Collect error evidence
        if: steps.assemble.outcome == 'failure'
        run: |
          mkdir -p error-dump
          cp assemble.log error-dump/ || true
          # Kotlin compiler errors
          find app/build -name '*.log' 2>/dev/null | head -50 | while read f; do
            mkdir -p "error-dump/$(dirname "$f")"
            cp "$f" "error-dump/$f" 2>/dev/null || true
          done
          # Grep all e: lines
          (find app/build -type f \( -name '*.log' -o -name '*.txt' \) -exec grep -H '^e: ' {} + 2>/dev/null || true) > error-dump/all-e-errors.txt
          # KSP
          find app/build -path '*ksp*' -type d 2>/dev/null | head -5 >> error-dump/ksp-dirs.txt || true
          ls -laR app/build/tmp 2>/dev/null | head -100 > error-dump/tmp-listing.txt || true
          echo "Assemble outcome: ${{ steps.assemble.outcome }}" > error-dump/status.txt

      - name: Upload error dump
        if: steps.assemble.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: compile-error-dump
          path: error-dump/
          if-no-files-found: warn

      - name: Fail job if assemble failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      - name: Unit tests
        if: steps.assemble.outcome == 'success'
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  assemble-ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug with NDK
        run: ./gradlew :app:assembleDebug -Paura.enableNdk=true --no-daemon --stacktrace
