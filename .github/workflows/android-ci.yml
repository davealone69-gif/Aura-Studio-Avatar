name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  assemble-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug (no NDK)
        id: assemble
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log
        continue-on-error: true

      - name: List build outputs
        if: always()
        run: |
          echo "=== assemble.log (last 80 lines) ==="
          tail -80 assemble.log || true
          echo "=== APK search ==="
          find app/build -name "*.apk" -type f 2>/dev/null || echo "no apks"
          ls -laR app/build/outputs 2>/dev/null || echo "no outputs dir"
          mkdir -p build-artifacts
          cp assemble.log build-artifacts/ || true
          find app/build -name "*.apk" -type f -exec cp {} build-artifacts/ \; 2>/dev/null || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null > build-artifacts/apk-dir.txt || echo "no debug apk dir" > build-artifacts/apk-dir.txt

      - name: Upload build artifacts (log + any APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-and-logs
          path: build-artifacts/
          if-no-files-found: warn

      - name: Fail job if assemble failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      - name: Unit tests
        if: steps.assemble.outcome == 'success'
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

  assemble-ndk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug with NDK
        id: assemble-ndk
        run: ./gradlew :app:assembleDebug -Paura.enableNdk=true --no-daemon --stacktrace 2>&1 | tee assemble-ndk.log
        continue-on-error: true

      - name: Upload NDK log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-assemble-log
          path: assemble-ndk.log
          if-no-files-found: warn
