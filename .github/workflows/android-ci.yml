name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  assemble-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Clean and Assemble debug (no NDK)
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:clean :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log

      - name: Verify APK exists and collect artifacts
        if: always()
        run: |
          echo "=== last 120 lines of assemble.log ==="
          tail -120 assemble.log || true
          echo "=== searching for APKs ==="
          find app/build -name "*.apk" -type f -print || true
          mkdir -p build-artifacts
          cp assemble.log build-artifacts/ || true
          # Prefer standard location
          if ls app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            cp -v app/build/outputs/apk/debug/*.apk build-artifacts/
            echo "APK_FOUND=true" >> $GITHUB_ENV
          else
            echo "APK_FOUND=false" >> $GITHUB_ENV
            # still copy anything that looks like an apk
            find app/build -name "*.apk" -type f -exec cp -v {} build-artifacts/ \; || true
          fi
          ls -la build-artifacts/ || true

      - name: Upload build artifacts (log + APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-and-logs
          path: build-artifacts/
          if-no-files-found: warn

      - name: Fail if no APK was produced
        if: env.APK_FOUND != 'true'
        run: |
          echo "No debug APK found after assembleDebug. See assemble.log in the artifact."
          exit 1

  assemble-ndk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Gradle and generate wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Assemble debug with NDK
        run: ./gradlew :app:assembleDebug -Paura.enableNdk=true --no-daemon --stacktrace 2>&1 | tee assemble-ndk.log
        continue-on-error: true

      - name: Upload NDK log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-assemble-log
          path: assemble-ndk.log
          if-no-files-found: warn
