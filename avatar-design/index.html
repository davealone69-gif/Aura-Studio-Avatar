<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Avatar Design Studio</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee;display:grid;place-items:center;min-height:100vh}.app{width:min(1100px,94vw);padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}canvas{width:100%;max-height:70vh;background:#f7f7f7;border-radius:18px}.panel{background:#1d1d1d;padding:18px;border-radius:18px}.row{display:grid;gap:8px;margin:12px 0}button,select,input{padding:10px;border-radius:10px;border:1px solid #444}button{cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button.active{outline:2px solid #8b7cff}</style></head><body><main class="app"><h1>🎨 Aura Avatar Design Studio</h1><div class="grid"><section><canvas id="avatar" width="700" height="800"></canvas></section><section class="panel"><div class="row"><b>Style</b><div class="chips" id="styles"></div></div><div class="row"><label>Skin <input id="skin" type="color" value="#FFD5B8"></label><label>Hair <input id="hair" type="color" value="#4A3728"></label><label>Eyes <input id="eyes" type="color" value="#4A90E2"></label><label>Clothing <input id="clothing" type="color" value="#667EEA"></label></div><div class="row"><label>Hair style<select id="hairStyle"><option>short</option><option>long</option><option>curly</option><option>bald</option><option>mohawk</option><option>bob</option><option>ponytail</option><option>buzz</option></select></label><label>Accessory<select id="accessory"><option>none</option><option>glasses</option><option>sunglasses</option><option>earrings</option><option>hat</option><option>headphones</option><option>crown</option><option>scarf</option></select></label></div><div class="row"><label>Name <input id="name" placeholder="Avatar name"></label></div><div class="row"><button id="animate">▶ Preview animation</button><button id="image">🖼 Export PNG</button><button id="config">📋 Export JSON</button></div></section></div></main><script src="avatarDesignSystem.js"></script></body></html>
